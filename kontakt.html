    <style>
        :root {
            --primary-color: #007A87; 
            --dark-color: #1a1a1a;
            --light-color: #f4f6f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--light-color); color: var(--dark-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { text-align: center; max-width: 800px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: var(--primary-color); margin-bottom: 10px; }
        p { color: #666; margin-bottom: 40px; }
        .cards { display: flex; gap: 25px; justify-content: center; flex-wrap: wrap; }
        .card { background: #fafbfc; border-radius: 12px; padding: 25px; width: 250px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-top: 5px solid #5865F2; }
        .avatar { background: #eaeeef; width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; }
        h3 { margin-bottom: 5px; font-size: 1.25rem; }
        .role { color: #5865F2; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .btn-back { display: inline-block; margin-top: 40px; text-decoration: none; color: var(--primary-color); font-weight: bold; transition: opacity 0.3s; }
        .btn-back:hover { opacity: 0.8; }
    </style>
</head>
